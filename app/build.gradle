plugins { id 'com.android.application' }

android {
    namespace 'com.glasstv.launcher'
    compileSdk 35

    buildFeatures { buildConfig true; prefab true }
    ndkVersion "27.0.12077973"
    externalNativeBuild { cmake { path file("../.airplay-source/app/src/main/cpp/CMakeLists.txt"); version "3.22.1" } }

    defaultConfig {
        applicationId 'com.glasstv.launcher'
        minSdk 28
        targetSdk 35
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
        versionCode 22
        versionName '0.5.15'
    }
    signingConfigs {
        permanent {
            if (System.getenv('GLASSTV_KEYSTORE')) {
                storeFile file(System.getenv('GLASSTV_KEYSTORE'))
                storePassword System.getenv('GLASSTV_STORE_PASSWORD')
                keyAlias System.getenv('GLASSTV_KEY_ALIAS')
                keyPassword System.getenv('GLASSTV_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug { if (System.getenv('GLASSTV_KEYSTORE')) signingConfig signingConfigs.permanent }
        release { minifyEnabled false; if (System.getenv('GLASSTV_KEYSTORE')) signingConfig signingConfigs.permanent }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}




dependencies {
    implementation "com.google.oboe:oboe:1.9.3"
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.media3:media3-exoplayer:1.4.1'
    implementation 'androidx.media3:media3-ui:1.4.1'
    implementation 'androidx.media3:media3-database:1.4.1'
}
