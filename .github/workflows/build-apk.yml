name: Build GlassTV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: glasstv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      stable: ${{ steps.signing.outputs.stable }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure permanent signing
        id: signing
        env:
          SIGNING_JSON: ${{ secrets.GLASSTV_SIGNING_JSON }}
        run: |
          python3 - <<'PY'
          import os,json,base64,pathlib
          raw=os.environ.get("SIGNING_JSON","")
          if not raw:
              with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("stable=false\n")
              print("Signing secret missing: CI checks run, release publication is disabled.")
          else:
              cfg=json.loads(raw)
              print("::add-mask::"+cfg["password"])
              key=pathlib.Path(os.environ["RUNNER_TEMP"])/"glasstv-signing.p12"
              key.write_bytes(base64.b64decode(cfg["keystore"],validate=True));key.chmod(0o600)
              if any("\n" in cfg[k] or "\r" in cfg[k] for k in ["password","alias"]): raise ValueError("Invalid signing configuration")
              with open(os.environ["GITHUB_ENV"],"a") as f:
                  f.write("GLASSTV_KEYSTORE="+str(key)+"\nGLASSTV_STORE_PASSWORD="+cfg["password"]+"\nGLASSTV_KEY_ALIAS="+cfg["alias"]+"\n")
              with open(os.environ["GITHUB_OUTPUT"],"a") as f: f.write("stable=true\n")
          PY
      - name: Compile APK and run Android lint
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Verify APK signature and Android compatibility
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GlassTV-0.5.10.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk | tee dist/apk-info.txt
          grep -q "sdkVersion:'28'" dist/apk-info.txt
          grep -q "leanback-launchable-activity:" dist/apk-info.txt
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GlassTV-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GlassTV-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: GlassTV-debug-apk
          path: dist
      - name: Decode deterministic H264 playback fixture
        run: python3 -c 'import base64,pathlib; pathlib.Path("/tmp/glasstv-playback.mp4").write_bytes(base64.b64decode(pathlib.Path(".github/fixtures/playback.mp4.b64").read_text()))'
      - name: Install WebKit form regression test
        run: |
          python3 -m pip install playwright==1.56.0
          python3 -m playwright install --with-deps webkit
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb install dist/GlassTV-0.5.10.apk
            cat /tmp/glasstv-playback.mp4 | adb shell 'run-as com.glasstv.launcher sh -c "mkdir -p files; cat > files/playback-test.mp4"'
            printf '<map><string name="saver_video">file:///data/user/0/com.glasstv.launcher/files/playback-test.mp4</string></map>' | adb shell 'run-as com.glasstv.launcher sh -c "mkdir -p shared_prefs; cat > shared_prefs/appearance.xml"'
            adb shell am start -W -n com.glasstv.launcher/.MainActivity
            sleep 3
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/home.png
            adb shell input keyevent 22
            sleep 1
            adb exec-out screencap -p > screenshots/focus.png
            adb shell input keyevent 82
            sleep 1
            adb exec-out screencap -p > screenshots/controls.png
            adb shell input keyevent 20 20 20 20 20 20 20
            adb shell input keyevent 23
            sleep 1
            adb exec-out screencap -p > screenshots/developer.png
            adb shell input keyevent 82
            sleep 1
            adb shell input keyevent 20 20 20 20 20 20 20 20
            adb shell input keyevent 23
            for attempt in $(seq 1 60); do if adb logcat -d -s GLASSTV_AERIAL:I | grep -q FIRST_FRAME; then break; fi; sleep 2; done
            adb logcat -d -s GLASSTV_AERIAL:I > screenshots/aerial-playback.txt
            grep -q FIRST_FRAME screenshots/aerial-playback.txt
            adb exec-out screencap -p > screenshots/aerial-preview.png
            adb shell input keyevent 4
            adb shell input keyevent 82
            sleep 1
            adb shell input keyevent 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20
            sleep 1
            adb exec-out screencap -p > screenshots/controls-bottom.png
            adb shell uiautomator dump /sdcard/panel.xml
            adb pull /sdcard/panel.xml screenshots/panel.xml
            python3 -c 'import xml.etree.ElementTree as E; n=[x for x in E.parse("screenshots/panel.xml").iter("node") if x.get("focused")=="true"]; assert len(n)==1 and n[0].get("text")=="Fermer", n'
            adb shell input keyevent 4
            adb shell input keyevent 20
            sleep 1
            adb exec-out screencap -p > screenshots/applications.png
            adb shell uiautomator dump /sdcard/grid.xml
            adb pull /sdcard/grid.xml screenshots/grid.xml
            python3 -c 'import re,xml.etree.ElementTree as E; n=[x for x in E.parse("screenshots/grid.xml").iter("node") if x.get("focused")=="true"]; assert len(n)==1,n; x,y,r,b=map(int,re.findall(r"\d+",n[0].get("bounds"))); assert x>=0 and y>=0 and r<=1920 and b<=1080,(x,y,r,b)'
            adb shell input keyevent 4
            adb shell dumpsys activity activities | grep -E 'mResumedActivity.*com.glasstv.launcher'
            adb shell input keyevent 82
            adb shell input keyevent 20 20 20 20 20 20 20 20 20 20 20 20
            adb shell input keyevent 23
            sleep 1
            adb exec-out screencap -p > screenshots/phone-setup.png
            python3 .github/scripts/test-phone-setup.py
            adb shell am force-stop com.glasstv.launcher
            printf '<map><boolean name="developer" value="true"/><boolean name="saver_auto" value="false"/></map>' | adb shell 'run-as com.glasstv.launcher sh -c "cat > shared_prefs/appearance.xml"'
            adb logcat -c
            adb shell am start -W -n com.glasstv.launcher/.MainActivity
            sleep 2
            adb shell input keyevent 82
            sleep 1
            adb shell input keyevent 20 20 20 20 20 20 20 20
            adb shell input keyevent 23
            for attempt in $(seq 1 50); do if adb logcat -d -s GLASSTV_AERIAL:I | grep -q 'FIRST_FRAME.*remote=true'; then break; fi; sleep 2; done
            adb logcat -d -s GLASSTV_AERIAL > screenshots/remote-playback.txt
            grep -q 'FIRST_FRAME.*remote=true' screenshots/remote-playback.txt
            adb exec-out screencap -p > screenshots/remote-aerial.png
            python3 .github/scripts/test-aerial-navigation.py
            adb logcat -d -b crash > screenshots/crash.txt
            test ! -s screenshots/crash.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GlassTV-Android11-screenshots
          path: screenshots/
  release:
    needs: [build, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.build.outputs.stable == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GlassTV-debug-apk
          path: dist
      - name: Publish installable preview APK
        run: |
          if gh release view v0.5.10 >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          Configuration TMDB par QR code depuis le téléphone sur le même réseau local. Aucune clé TMDB incluse dans l’APK. Clé enregistrée uniquement sur la box et conservée aux mises à jour.
          Économiseur : six vidéos AerialShots, catégories Océan / Montagnes / Forêts et vallées. Gauche/droite : vidéo, haut/bas : catégorie. Fondus de 2,4 secondes avec conservation de l’image pendant le chargement. Gestes tactiles également disponibles. Retour ou OK : quitter.
          Installer par-dessus GlassTV 0.5.3 ou plus récent, sans désinstaller, pour conserver les réglages.
          NOTES
          gh release create v0.5.10 dist/GlassTV-0.5.10.apk dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "GlassTV 0.5.10 — Nouvelle interface TV" --notes-file notes.md --prerelease


