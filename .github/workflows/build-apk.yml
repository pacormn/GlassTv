name: Build GlassTV APK
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: glasstv-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Compile APK and run Android lint
        run: gradle :app:assembleDebug :app:lintDebug --no-daemon --stacktrace
      - name: Verify APK signature and Android compatibility
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/GlassTV-0.5.0-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/*.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging dist/*.apk | tee dist/apk-info.txt
          grep -q "sdkVersion:'28'" dist/apk-info.txt
          grep -q "leanback-launchable-activity:" dist/apk-info.txt
          cd dist
          sha256sum *.apk > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GlassTV-debug-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GlassTV-lint-report
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  smoke:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GlassTV-debug-apk
          path: dist
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1920x1080
            adb shell wm density 320
            adb install dist/GlassTV-0.5.0-debug.apk
            adb shell am start -W -n com.glasstv.launcher/.MainActivity
            sleep 3
            mkdir -p screenshots
            adb exec-out screencap -p > screenshots/home.png
            adb shell input keyevent 22
            sleep 1
            adb exec-out screencap -p > screenshots/focus.png
            adb shell input keyevent 82
            sleep 1
            adb exec-out screencap -p > screenshots/controls.png
            adb shell input keyevent 20 20 20 20 20 20 20
            adb shell input keyevent 23
            sleep 1
            adb exec-out screencap -p > screenshots/developer.png
            adb shell input keyevent 82
            sleep 1
            adb shell input keyevent 20 20 20 20 20 20 20 20
            adb shell input keyevent 23
            sleep 2
            adb exec-out screencap -p > screenshots/aerial-preview.png
            adb shell input keyevent 4
            adb shell input keyevent 82
            sleep 1
            adb shell input keyevent 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20 20
            sleep 1
            adb exec-out screencap -p > screenshots/controls-bottom.png
            adb shell uiautomator dump /sdcard/panel.xml
            adb pull /sdcard/panel.xml screenshots/panel.xml
            python3 -c 'import xml.etree.ElementTree as E; n=[x for x in E.parse("screenshots/panel.xml").iter("node") if x.get("focused")=="true"]; assert len(n)==1 and n[0].get("text")=="Fermer", n'
            adb shell input keyevent 4
            adb shell input keyevent 20
            sleep 1
            adb exec-out screencap -p > screenshots/applications.png
            adb shell uiautomator dump /sdcard/grid.xml
            adb pull /sdcard/grid.xml screenshots/grid.xml
            python3 -c 'import re,xml.etree.ElementTree as E; n=[x for x in E.parse("screenshots/grid.xml").iter("node") if x.get("focused")=="true"]; assert len(n)==1,n; x,y,r,b=map(int,re.findall(r"\d+",n[0].get("bounds"))); assert x>=0 and y>=0 and r<=1920 and b<=1080,(x,y,r,b)'
            adb shell input keyevent 4
            adb shell dumpsys activity activities | grep -E 'mResumedActivity.*com.glasstv.launcher'
            adb logcat -d -b crash > screenshots/crash.txt
            test ! -s screenshots/crash.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GlassTV-Android11-screenshots
          path: screenshots/
  release:
    needs: [build, smoke]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GlassTV-debug-apk
          path: dist
      - name: Publish installable preview APK
        run: |
          if gh release view v0.5.0 >/dev/null 2>&1; then exit 0; fi
          cat > notes.md <<'NOTES'
          Mode développeur : version en bas à droite et bouton de test de l’économiseur. Lecteur aérien silencieux après 3 minutes dans GlassTV, source distante ou vidéo locale. Bannières TMDB non connectées : clé utilisateur encore nécessaire.
          Trois ambiances et option animations réduites.
          APK de test pour Android TV 11, compilé et testé sur émulateur API 30.
          Installer GlassTV-0.5.0-debug.apk. Si Android refuse la mise à jour à cause de la signature debug, désinstaller la version 0.1.0 puis installer celle-ci.
          Aucun service Apple intégré et aucune mise à jour automatique.
          NOTES
          gh release create v0.5.0 dist/GlassTV-0.5.0-debug.apk dist/SHA256SUMS.txt --target "${{ github.sha }}" --title "GlassTV 0.5.0 — Nouvelle interface TV" --notes-file notes.md --prerelease


